<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workspace Search</title>

  <link rel="stylesheet" href="styles.css">

  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
 
</head>

<body>

  <div class="container">

 <h1>Work Package Search</h1>

    <div class="stats-row">

    <div id="stats" class="stats">
        Loading workspace statistics...
    </div>

    <button
        id="exportAllButton"
        onclick="exportAllData()">
        📁 Export All
    </button>

</div>

    <div class="search-container">
    <input
        type="text"
        id="searchInput"
        placeholder="Search work packages, subitems, keywords..."
    >

    <button
        id="clearButton"
        onclick="clearSearch()">
        Clear
    </button>
  </div>

    <div class="filters">

      <h3>Region Filter</h3>

      <label class="board-option">
        <input
          type="checkbox"
          id="selectAllBoards"
          checked>
        All Regions
      </label>

      <div id="boardList"></div>

    </div>

   <div class="results-header">

    <div id="resultCount"></div>

    <button
        id="exportResultsButton"
        onclick="exportSearchResults()">
        📊 Export Results
    </button>

</div>
 
<div id="results"></div>
 
</div>
 
<script src="search.js"></script>
 
</body>
</html>

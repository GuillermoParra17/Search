<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workspace Search</title>

  <link rel="stylesheet" href="styles.css">

  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
 
</head>

<body>

  <div class="container">

 <h1>Work Package Search</h1>

    <div class="stats-row">

    <div id="stats" class="stats">
        Loading workspace statistics...
    </div>

    <button
        id="exportAllButton"
        onclick="exportAllData()">
        📁 Export All
    </button>

</div>

    <div class="search-container">
    <input
        type="text"
        id="searchInput"
        placeholder='Search work packages, subitems, keywords...  (use "quotes" for an exact phrase)'
    >

    <button
        id="clearButton"
        onclick="clearSearch()">
        Clear
    </button>
  </div>

    <div class="filters">

      <h3>Region Filter</h3>

      <label class="board-option">
        <input
          type="checkbox"
          id="selectAllBoards"
          checked>
        All Regions
      </label>

      <div id="boardList"></div>

      <div class="search-scope">

        <h3>Search In</h3>
      
        <label class="board-option">
          <input type="checkbox" class="search-field" value="itemName" checked>
          Work Package
        </label>
      
        <label class="board-option">
          <input type="checkbox" class="search-field" value="subitems" checked>
          Subitems
        </label>
      
        <label class="board-option">
          <input type="checkbox" class="search-field" value="description" checked>
          Description
        </label>
      
        <label class="board-option">
          <input type="checkbox" class="search-field" value="learnings" checked>
          Learnings
        </label>
      
        <label class="board-option">
          <input type="checkbox" class="search-field" value="realizedHWWK" checked>
          Realized HWWK
        </label>
      
        <label class="board-option">
          <input type="checkbox" class="search-field" value="diseaseArea" checked>
          Disease Area
        </label>
      
        <label class="board-option">
          <input type="checkbox" class="search-field" value="product" checked>
          Product
        </label>

        <label class="board-option">
            <input type="checkbox" id="showSimilarMatches">
            Show Similar Matches
        </label>     
      
      </div>
      
    </div>

   <div class="results-header">

    <div id="resultCount"></div>

    <div class="results-actions">

        <label class="sort-label">
            Sort by
            <select id="sortSelect">
                <option value="relevance">Relevance</option>
                <option value="name-asc">Work package A → Z</option>
                <option value="name-desc">Work package Z → A</option>
                <option value="board-asc">Board A → Z</option>
            </select>
        </label>

        <button
            id="exportResultsButton"
            onclick="exportSearchResults()">
            📊 Export Results
        </button>

    </div>

</div>
 
<div id="results"></div>
 
</div>
 
<script src="search.js"></script>
 
</body>
</html>

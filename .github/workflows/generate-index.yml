name: Generate Search Index

on:
  workflow_dispatch:

  schedule:
    # Two runs a day, both at odd minutes (GitHub is busiest on the hour).
    # The second one is a backup and is skipped if the first one already worked.
    - cron: "23 1 * * *"   # about 03:23 Budapest (02:23 after 25 October)
    - cron: "37 4 * * *"   # about 06:37 Budapest (05:37 after 25 October)

# never run two index builds at the same time
concurrency:
  group: generate-index
  cancel-in-progress: false

jobs:

  build-index:

    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check how old data.json is
        id: age
        run: |
          age=$(node -e "try{const t=Date.parse(require('./data.json').generatedAt);console.log(isNaN(t)?99999:Math.round((Date.now()-t)/60000))}catch(e){console.log(99999)}")
          echo "data.json is $age minutes old"
          echo "minutes=$age" >> "$GITHUB_OUTPUT"

      # scheduled runs are skipped when the data is less than 4 hours old;
      # manual runs ("Run workflow") always run
      - name: Run Index Generator
        if: ${{ github.event_name != 'schedule' || fromJSON(steps.age.outputs.minutes) > 240 }}
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
        run: |
          node generate-index.js

      - name: Report boards that could not be refreshed
        if: ${{ github.event_name != 'schedule' || fromJSON(steps.age.outputs.minutes) > 240 }}
        run: |
          node -e "const f=require('./data.json').failedBoards||[]; if(f.length) console.log('::warning title=Boards not refreshed::'+f.join(', '))"

      - name: Commit data.json
        if: ${{ github.event_name != 'schedule' || fromJSON(steps.age.outputs.minutes) > 240 }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "data.json did not change - nothing to commit"
            exit 0
          fi
          git commit -m "Update search index"
          git pull --rebase origin main
          git push origin HEAD:main

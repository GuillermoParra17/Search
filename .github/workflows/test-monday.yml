name: Test Workspace

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Query Workspace
        run: |
          curl -X POST https://api.monday.com/v2 \
          -H "Authorization: ${{ secrets.MONDAY_API_TOKEN }}" \
          -H "Content-Type: application/json" \
          -d '{"query":"{ workspaces(ids: 2266387) { id name } }"}'

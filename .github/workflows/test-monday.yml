name: Check Specific Work Package

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check Item
        run: |
          curl -X POST https://api.monday.com/v2 \
          -H "Authorization: ${{ secrets.MONDAY_API_TOKEN }}" \
          -H "Content-Type: application/json" \
          -d '{"query":"{ boards(ids:2034425268) { items_page(limit:20) { items { id name column_values(ids:[\"long_text_1\"]) { id text } } } } }"}'
